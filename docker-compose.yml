services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orion-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - UV_THREADPOOL_SIZE=16
      - ORION_DB_PATH=/data/orion.db
      - PORT=3000
    volumes:
      - orion-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/v1/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: orion-postgres
    profiles:
      - postgres
      - multi-pod
    environment:
      - POSTGRES_DB=orion
      - POSTGRES_USER=orion_user
      - POSTGRES_PASSWORD=orion_secure_password_replace_in_prod
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orion_user -d orion"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: orion-redis
    profiles:
      - multi-pod
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  orion-data:
  pg-data:
  redis-data:
